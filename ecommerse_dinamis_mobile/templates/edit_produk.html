<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Edit Produk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <h5 class="fw-bold mb-3">✏️ Edit Produk</h5>
    <form method="POST" class="card p-3 shadow-sm">
        <div class="mb-2">
            <label class="form-label">Nama Produk</label>
            <input type="text" name="nama" class="form-control"
                   value="{{ produk.nama }}" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Harga</label>
            <input type="number" name="harga" class="form-control"
                   value="{{ produk.harga }}" required>
        </div>
        <div class="mb-2">
            <label class="form-label">Kategori</label>
            <select name="kategori" class="form-select" required>
                {% set kategori_list = [
                    "analgesik","antibiotik","antijamur","antidiare",
                    "antidiabetes","antiemetik","lambung",
                    "bronkodilator","suplemen","Obat Demam","Obat alergi","Kortikosteroid"
                ] %}
                {% for k in kategori_list %}
                <option value="{{ k }}" {% if produk.kategori == k %}selected{% endif %}>
                    {{ k }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Path Gambar</label>
            <input type="text" name="gambar" class="form-control"
                   value="{{ produk.gambar }}" required>
        </div>

        <button class="btn btn-primary w-100">💾 Simpan Perubahan</button>
    </form>

    <a href="/" class="btn btn-secondary w-100 mt-2">⬅ Kembali</a>
</div>

<script src="/static/js/darkmode.js"></script>

</body>
</html>
