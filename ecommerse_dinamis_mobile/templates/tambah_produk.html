<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Produk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dark.css">
</head>
<body>

<div class="container mt-4">
    <h5 class="fw-bold mb-3">➕ Tambah Produk</h5>

    <form method="POST" enctype="multipart/form-data" class="card p-3 shadow-sm">

        <div class="mb-3">
            <label for="nama" class="form-label">Nama Produk</label>
            <input id="nama" type="text" name="nama" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="harga" class="form-label">Harga</label>
            <input id="harga" type="number" name="harga" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" name="kategori" class="form-select" required>
                <option value="analgesik">Analgesik</option>
                <option value="antibiotik">Antibiotik</option>
                <option value="antijamur">Antijamur</option>
                <option value="antidiare">Antidiare</option>
                <option value="antidiabetes">Antidiabetes</option>
                <option value="antiemetik">Antiemetik</option>
                <option value="lambung">Lambung</option>
                <option value="bronkodilator">Bronkodilator</option>
                <option value="suplemen">Suplemen</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Gambar Produk</label>
            <input type="file" name="gambar" class="form-control" accept="image/*" required>
        </div>


        <button class="btn btn-primary w-100">Simpan Produk</button>
    </form>

    <a href="/" class="btn btn-secondary w-100 mt-2">⬅ Kembali</a>
</div>

<script src="/static/js/darkmode.js"></script>

</body>
</html>
